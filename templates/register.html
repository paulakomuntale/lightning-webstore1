{% extends "base.html" %}

{% block content %}
<h2>Register</h2>
<form method="POST">
    <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" required>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
        <small>Email will be your username</small>
    </div>
    <button type="submit">Register</button>
</form>
{% endblock %}
