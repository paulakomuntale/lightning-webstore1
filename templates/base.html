<!DOCTYPE html>
<html>
<head>
    <title>Lightning Micro-Lend</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .nav { background: #2c3e50; padding: 15px; color: white; }
        .nav a { color: white; margin-right: 15px; text-decoration: none; }
        .container { max-width: 1200px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; }
        .btn { background: #f39c12; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #e67e22; }
        .error { color: red; padding: 10px; background: #fee; border-radius: 5px; margin: 10px 0; }
        .success { color: green; padding: 10px; background: #efe; border-radius: 5px; margin: 10px 0; }
        .stat-card { background: #ecf0f1; padding: 15px; border-radius: 5px; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .loan-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 4px; }
        label { font-weight: bold; }
    </style>
</head>
<body>

<div class="nav">
    <a href="/">⚡ Lightning Lend</a>
    <a href="/my_loans">📋 My Loans</a>
    <a href="/dashboard">📊 Dashboard</a>
    <a href="http://localhost:5000">🛒 Shop with Lightning</a>
    {% if user %}
        <span style="float: right;">Welcome, {{ user.name }} | <a href="/logout" style="color: white;">Logout</a></span>
    {% else %}
        <span style="float: right;"><a href="/register" style="color: white;">Register</a></span>
    {% endif %}
</div>


    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
